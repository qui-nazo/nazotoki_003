<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎解きゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #2c2c30;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 20px;
      background: #1f1f24;
      border-bottom: 1px solid #111;
      flex-shrink: 0;
    }
    header .logo {
      height: 44px;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      display: grid;
      grid-template-columns: 7.5fr 2.5fr;
      gap: 14px;
      padding: 14px;
      flex: 1;
      min-height: 0;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .panel {
      background: #3a3a40;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== Left panel: tabs + mission ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      border-bottom: 2px solid #555;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tab {
      padding: 10px 18px;
      cursor: pointer;
      background: transparent;
      border: none;
      font-size: 15px;
      color: #bbb;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
      font-family: inherit;
    }
    .tab:hover:not(:disabled) { color: #fff; }
    .tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    .mission-view {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mission-view img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 8px;
      display: block;
      object-fit: contain;
    }

    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: #888;
      font-size: 16px;
    }

    /* ===== Warehouse view ===== */
    .warehouse {
      align-self: stretch;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      border: 2px solid #888;
      border-radius: 8px;
      padding: 14px 16px;
      box-sizing: border-box;
      min-height: 0;
    }
    .warehouse-title {
      font-size: 16px;
      font-weight: 700;
      color: #eee;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .warehouse-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .warehouse-item {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .warehouse-item.empty {
      cursor: default;
    }
    .warehouse-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== Right panel: investigation results ===== */
    .right-panel h2 {
      margin-bottom: 12px;
      font-size: 17px;
      color: #eee;
      flex-shrink: 0;
    }
    .result-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }
    .result-btn {
      padding: 14px 14px;
      font-size: 17px;
      font-weight: 700;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s, transform .05s;
      font-family: inherit;
    }
    .result-btn:active { transform: scale(.98); }
    .result-btn.is-challenging {
      background: #1d6a35;
      color: #fff;
      border-color: #1d6a35;
    }
    .result-btn.is-show {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    /* ===== GM panel (hidden) ===== */
    .gm-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100vh;
      background: #1f1f24;
      color: #f0f0f0;
      padding: 24px 20px;
      box-shadow: -4px 0 18px rgba(0, 0, 0, .3);
      overflow-y: auto;
      z-index: 1000;
      transform: translateX(105%);
      transition: transform .25s ease;
    }
    .gm-panel.open { transform: translateX(0); }
    .gm-panel h2 { font-size: 20px; margin-bottom: 6px; }
    .gm-panel .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .gm-section { margin-bottom: 22px; }
    .gm-section h3 {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .gm-toggle {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #2a2a30;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background .15s;
      font-size: 14px;
    }
    .gm-toggle:hover { background: #34343c; }
    .gm-toggle.checked { background: #2c5530; }
    .gm-toggle input {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #4caf50;
    }
    .gm-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .gm-action {
      flex: 1;
      padding: 9px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    .gm-action:hover { background: #555; }
    .gm-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }
    .gm-close:hover { color: #fff; }

    /* ===== Image lightbox ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
      cursor: zoom-out;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 6px;
    }

    /* ===== Info popup ===== */
    .info-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      cursor: pointer;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    .info-popup.open { display: flex; }
    .info-popup-content {
      background: #fff;
      color: #000;
      padding: 40px 56px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      line-height: 1.7;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
    }

    /* ===== Intro overlay ===== */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .intro-overlay.open { display: flex; }
    .intro-overlay img,
    .intro-overlay video {
      max-width: 100%;
      max-height: 100%;
      display: none;
      pointer-events: none;
    }
    .intro-overlay img.active,
    .intro-overlay video.active { display: block; }

    @media (max-width: 600px) {
      body { overflow: auto; height: auto; }
      main { grid-template-columns: 1fr; }
      .panel { overflow: visible; }
      .mission-view { min-height: 300px; }
      .gm-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <img src="material/kaijodoko_logo.png" alt="ロゴ" class="logo" id="logo">
  </header>

  <main>
    <section class="panel left-panel">
      <div class="tabs" id="tabs"></div>
      <div class="mission-view" id="mission-view"></div>
    </section>

    <aside class="panel right-panel">
      <h2>モノサーチャー</h2>
      <div class="result-btns" id="result-btns"></div>
    </aside>
  </main>

  <aside class="gm-panel" id="gm-panel" aria-hidden="true">
    <button class="gm-close" id="gm-close" aria-label="閉じる">×</button>
    <h2>GMメニュー</h2>
    <div class="hint">
      ロゴを3回連続タップで開閉<br>
      （PCでは Ctrl + Shift + G でも可）
    </div>

    <div class="gm-section">
      <h3>ミッション公開</h3>
      <div id="gm-missions"></div>
    </div>

    <div class="gm-section">
      <h3>調査結果公開</h3>
      <div id="gm-results"></div>
    </div>

    <div class="gm-section">
      <h3>ゲーム進行</h3>
      <button class="gm-action" id="gm-start-intro" style="width:100%;padding:12px;">イントロから開始</button>
    </div>

    <div class="gm-actions">
      <button class="gm-action" id="gm-all-on">全て公開</button>
      <button class="gm-action" id="gm-all-off">全て非公開</button>
    </div>
  </aside>

  <div class="intro-overlay" id="intro-overlay">
    <img id="intro-img" alt="">
    <video id="intro-video" playsinline></video>
  </div>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>
  <div class="info-popup" id="info-popup"><div class="info-popup-content" id="info-popup-content"></div></div>

  <script>
    const MISSIONS = [
      { id: 'warehouse', label: '倉庫備品リスト' },
      { id: 'mission1', label: 'Mission 1',     img: 'material/mission_1.png' },
      { id: 'mission2', label: 'Mission 2',     img: 'material/mission_2.png' },
      { id: 'last1',    label: 'Last Mission',  img: 'material/last_mission_1.png' },
      { id: 'last2',    label: 'Last Mission 2', img: 'material/last_mission_2.png' },
    ];

    const WAREHOUSE_ITEMS = {
      mono_1: ['material/mono_1_1.png'],
      mono_2: ['material/mono_2_1.png', 'material/mono_2_2.png'],
      mono_3: ['material/mono_3_1.png', 'material/mono_3_2.png'],
      mono_4: ['material/mono_4_1.png', 'material/mono_4_2.png'],
      mono_5: ['material/mono_5_1.png'],
      mono_6: ['material/mono_6_1.png'],
      mono_7: ['material/mono_7_1.png'],
      mono_8: ['material/mono_8_1.png', 'material/mono_8_2.png', 'material/mono_8_3.png'],
      mono_9: [null, 'material/mono_9_1.png', 'material/mono_9_2.png', 'material/mono_9_3.png', 'material/mono_9_4.png'],
    };
    const WAREHOUSE_LAYOUT = [
      ['mono_1', 'mono_6'],
      ['mono_2', 'mono_7'],
      ['mono_3', 'mono_8'],
      ['mono_4', 'mono_9'],
      ['mono_5', null],
    ];

    const SETS = [
      { id: 'a', label: 'A', popup: 'Aセットに挑戦中\nすべてのパズルが解けたらクリア' },
      { id: 'b', label: 'B', popup: 'Bセットに挑戦中\nすべてのナゾが解けたらクリア' },
      { id: 'c', label: 'C', popup: 'Cセットに挑戦中\nすべてのクイズに正解できたらクリア' },
      { id: 'd', label: 'D', popup: 'Dセットに挑戦中\n全3問のクイズのうち、2問正解できたらクリア' },
      { id: 'e', label: 'E', popup: 'Eセットに挑戦中' },
      { id: 'f', label: 'F', popup: 'Fセットに挑戦中' },
    ];
    const setImg = id => `material/chousakekka_${id}.png`;

    const STORAGE_KEY = 'gm-visibility-v4';
    const DEFAULT_VIS = {
      missions:    { warehouse: true, mission1: true, mission2: false, last1: false, last2: false },
      results:     { a: false, b: false, c: false, d: false, e: false, f: false },
      challenging: { a: false, b: false, c: false, d: false, e: false, f: false },
      warehouse: {
        states: { mono_1: 0, mono_2: 0, mono_3: 0, mono_4: 0, mono_5: 0, mono_6: 0, mono_7: 0, mono_8: 0, mono_9: 0 },
        taps:   { mono_1: 0, mono_2: 0, mono_3: 0, mono_4: 0, mono_5: 0, mono_6: 0, mono_7: 0, mono_8: 0, mono_9: 0 }
      }
    };

    function loadVis() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          const parsed = JSON.parse(s);
          const pw = parsed.warehouse || {};
          return {
            missions:    { ...DEFAULT_VIS.missions,    ...(parsed.missions    || {}) },
            results:     { ...DEFAULT_VIS.results,     ...(parsed.results     || {}) },
            challenging: { ...DEFAULT_VIS.challenging, ...(parsed.challenging || {}) },
            warehouse: {
              states: { ...DEFAULT_VIS.warehouse.states, ...(pw.states || {}) },
              taps:   { ...DEFAULT_VIS.warehouse.taps,   ...(pw.taps   || {}) }
            }
          };
        }
      } catch (e) { /* fallthrough */ }
      return JSON.parse(JSON.stringify(DEFAULT_VIS));
    }
    function saveVis() { localStorage.setItem(STORAGE_KEY, JSON.stringify(vis)); }

    let vis = loadVis();
    let activeTab = null;

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      const view = document.getElementById('mission-view');
      tabs.innerHTML = '';

      const visibleMissions = MISSIONS.filter(m => vis.missions[m.id]);
      if (activeTab && !vis.missions[activeTab]) activeTab = null;
      if (!activeTab && visibleMissions.length) activeTab = visibleMissions[0].id;

      visibleMissions.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (activeTab === m.id ? ' active' : '');
        btn.textContent = m.label;
        btn.onclick = () => { activeTab = m.id; renderTabs(); };
        tabs.appendChild(btn);
      });

      view.innerHTML = '';
      if (!visibleMissions.length) {
        view.innerHTML = '<div class="empty-state">まだミッションは公開されていません</div>';
        return;
      }
      if (activeTab === 'warehouse') {
        renderWarehouse(view);
        return;
      }
      const current = MISSIONS.find(m => m.id === activeTab);
      if (current && current.img) {
        const img = document.createElement('img');
        img.src = current.img;
        img.alt = current.label;
        view.appendChild(img);
      }
    }

    function renderWarehouse(view) {
      const wrap = document.createElement('div');
      wrap.className = 'warehouse';

      const title = document.createElement('div');
      title.className = 'warehouse-title';
      title.textContent = '倉庫備品リスト(ゲーム開始時)';
      wrap.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'warehouse-grid';
      WAREHOUSE_LAYOUT.forEach(row => {
        row.forEach(id => {
          const cell = document.createElement('div');
          cell.className = 'warehouse-item';
          if (id) {
            const states = WAREHOUSE_ITEMS[id];
            const stateIdx = vis.warehouse.states[id] || 0;
            const src = states[stateIdx];
            if (src) {
              const img = document.createElement('img');
              img.src = src;
              img.alt = id;
              cell.appendChild(img);
            }
            cell.onclick = () => tapWarehouseItem(id);
          } else {
            cell.classList.add('empty');
          }
          grid.appendChild(cell);
        });
      });
      wrap.appendChild(grid);
      view.appendChild(wrap);
    }

    function tapWarehouseItem(id) {
      const states = WAREHOUSE_ITEMS[id];
      if (!states || states.length <= 1) return;
      vis.warehouse.taps[id] = (vis.warehouse.taps[id] || 0) + 1;
      if (vis.warehouse.taps[id] >= 3) {
        vis.warehouse.taps[id] = 0;
        vis.warehouse.states[id] = ((vis.warehouse.states[id] || 0) + 1) % states.length;
        saveVis();
        renderTabs();
      } else {
        saveVis();
      }
    }

    const yobidashi = new Audio('material/mono_searcher_yobidashi.mp3');
    yobidashi.preload = 'auto';
    function playYobidashi() {
      try { yobidashi.currentTime = 0; yobidashi.play().catch(() => {}); } catch (e) {}
    }

    function renderResults() {
      const btnContainer = document.getElementById('result-btns');
      btnContainer.innerHTML = '';

      SETS.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'result-btn';

        if (vis.results[s.id]) {
          btn.classList.add('is-show');
          btn.textContent = `${s.label}の調査結果を見る`;
          btn.onclick = () => openLightbox(setImg(s.id), `${s.label} 調査結果`);
        } else if (vis.challenging[s.id]) {
          btn.classList.add('is-challenging');
          btn.textContent = `${s.label}セット 挑戦中`;
          btn.onclick = () => {
            vis.challenging[s.id] = false;
            saveVis();
            renderResults();
          };
        } else {
          btn.textContent = `${s.label}セットを解く`;
          btn.onclick = () => {
            vis.challenging[s.id] = true;
            saveVis();
            playYobidashi();
            renderResults();
            showInfoPopup(s.popup);
          };
        }
        btnContainer.appendChild(btn);
      });
    }

    function renderGM() {
      const mC = document.getElementById('gm-missions');
      const rC = document.getElementById('gm-results');
      mC.innerHTML = '';
      rC.innerHTML = '';

      MISSIONS.forEach(m => mC.appendChild(makeToggle(m, vis.missions, () => {
        saveVis(); renderTabs(); renderGM();
      })));
      SETS.forEach(s => rC.appendChild(makeToggle(
        { id: s.id, label: `${s.label}の調査結果を公開` },
        vis.results,
        () => { saveVis(); renderResults(); renderGM(); }
      )));
    }

    function makeToggle(item, store, onChange) {
      const lbl = document.createElement('label');
      lbl.className = 'gm-toggle' + (store[item.id] ? ' checked' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!store[item.id];
      cb.onchange = () => { store[item.id] = cb.checked; onChange(); };
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(item.label));
      return lbl;
    }

    function renderAll() { renderTabs(); renderResults(); renderGM(); }

    // ===== GM panel toggle =====
    const gmPanel = document.getElementById('gm-panel');
    function toggleGM() {
      gmPanel.classList.toggle('open');
      gmPanel.setAttribute('aria-hidden', gmPanel.classList.contains('open') ? 'false' : 'true');
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'G' || e.key === 'g')) {
        e.preventDefault();
        toggleGM();
      }
      if (e.key === 'Escape') {
        if (introOverlay.classList.contains('open')) { endIntro(); return; }
        if (infoPopup.classList.contains('open')) { closeInfoPopup(); return; }
        if (gmPanel.classList.contains('open')) toggleGM();
        closeLightbox();
      }
    });

    document.getElementById('gm-close').onclick = toggleGM;

    document.addEventListener('click', (e) => {
      if (!gmPanel.classList.contains('open')) return;
      if (gmPanel.contains(e.target)) return;
      if (e.target.id === 'logo') return;
      toggleGM();
    });

    let logoClicks = 0;
    let logoTimer = null;
    document.getElementById('logo').addEventListener('click', () => {
      logoClicks++;
      if (logoTimer) clearTimeout(logoTimer);
      logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
      if (logoClicks >= 3) { logoClicks = 0; toggleGM(); }
    });

    document.getElementById('gm-all-on').onclick = () => {
      MISSIONS.forEach(m => vis.missions[m.id] = true);
      SETS.forEach(s => vis.results[s.id] = true);
      saveVis(); renderAll();
    };
    document.getElementById('gm-all-off').onclick = () => {
      Object.keys(vis.missions).forEach(k => vis.missions[k] = false);
      vis.missions.warehouse = true;
      vis.missions.mission1 = true;
      SETS.forEach(s => { vis.results[s.id] = false; vis.challenging[s.id] = false; });
      Object.keys(vis.warehouse.states).forEach(k => { vis.warehouse.states[k] = 0; vis.warehouse.taps[k] = 0; });
      saveVis(); renderAll();
    };

    // ===== Intro overlay =====
    const INTRO_STEPS = [
      { type: 'image', src: 'material/title.png' },
      { type: 'image', src: 'material/introduction.png' },
      { type: 'video', src: 'material/countdown.mp4' },
    ];
    const introOverlay = document.getElementById('intro-overlay');
    const introImg = document.getElementById('intro-img');
    const introVideo = document.getElementById('intro-video');
    let introStep = -1;

    function startIntro() {
      if (gmPanel.classList.contains('open')) toggleGM();
      introStep = -1;
      introOverlay.classList.add('open');
      advanceIntro();
    }

    function advanceIntro() {
      introStep++;
      introImg.classList.remove('active');
      introVideo.classList.remove('active');
      introVideo.pause();

      if (introStep >= INTRO_STEPS.length) {
        endIntro();
        return;
      }
      const step = INTRO_STEPS[introStep];
      if (step.type === 'image') {
        introImg.src = step.src;
        introImg.classList.add('active');
      } else if (step.type === 'video') {
        introVideo.src = step.src;
        introVideo.classList.add('active');
        introVideo.currentTime = 0;
        const p = introVideo.play();
        if (p && p.catch) p.catch(() => { /* autoplay blocked — tap to advance */ });
      }
    }

    function endIntro() {
      introOverlay.classList.remove('open');
      introImg.classList.remove('active');
      introVideo.classList.remove('active');
      introVideo.pause();
      introVideo.removeAttribute('src');
      introVideo.load();
    }

    introOverlay.addEventListener('click', advanceIntro);
    introVideo.addEventListener('ended', advanceIntro);
    document.getElementById('gm-start-intro').onclick = startIntro;

    // ===== Info popup =====
    const infoPopup = document.getElementById('info-popup');
    const infoPopupContent = document.getElementById('info-popup-content');
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function showInfoPopup(text) {
      infoPopupContent.innerHTML = text.split('\n').map(escapeHtml).join('<br>');
      infoPopup.classList.add('open');
    }
    function closeInfoPopup() { infoPopup.classList.remove('open'); }
    infoPopup.addEventListener('click', closeInfoPopup);

    // ===== Lightbox =====
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); }
    lightbox.addEventListener('click', closeLightbox);

    // ===== Preload all assets =====
    function preloadAssets() {
      const warehouseImgs = Object.values(WAREHOUSE_ITEMS).flat().filter(Boolean);
      const images = [
        'material/title.png',
        'material/introduction.png',
        ...MISSIONS.map(m => m.img).filter(Boolean),
        ...SETS.map(s => setImg(s.id)),
        ...warehouseImgs,
      ];
      images.forEach(src => { const i = new Image(); i.src = src; });
      fetch('material/countdown.mp4', { cache: 'force-cache' }).catch(() => {});
      fetch('material/mono_searcher_yobidashi.mp3', { cache: 'force-cache' }).catch(() => {});
    }
    preloadAssets();

    renderAll();
  </script>
</body>
</html>
