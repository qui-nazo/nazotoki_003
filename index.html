<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎解きゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #2c2c30;
      color: #eee;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 24px;
      background: #1f1f24;
      border-bottom: 1px solid #111;
    }
    header .logo {
      height: 56px;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      display: grid;
      grid-template-columns: 8fr 2fr;
      gap: 20px;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .panel {
      background: #3a3a40;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      padding: 20px;
    }

    /* ===== Left panel: tabs + mission ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      border-bottom: 2px solid #555;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 18px;
      cursor: pointer;
      background: transparent;
      border: none;
      font-size: 15px;
      color: #bbb;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
      font-family: inherit;
    }
    .tab:hover:not(:disabled) { color: #fff; }
    .tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    .mission-view {
      min-height: 400px;
    }
    .mission-view img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: #888;
      font-size: 16px;
    }

    /* ===== Right panel: investigation results ===== */
    .right-panel h2 {
      margin-bottom: 14px;
      font-size: 18px;
      color: #eee;
    }
    .result-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .result-btn {
      padding: 16px 18px;
      font-size: 19px;
      font-weight: 700;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, transform .05s;
      font-family: inherit;
    }
    .result-btn:hover { background: #f0f0f0; }
    .result-btn:active { transform: scale(.98); }

    /* ===== GM panel (hidden) ===== */
    .gm-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100vh;
      background: #1f1f24;
      color: #f0f0f0;
      padding: 24px 20px;
      box-shadow: -4px 0 18px rgba(0, 0, 0, .3);
      overflow-y: auto;
      z-index: 1000;
      transform: translateX(105%);
      transition: transform .25s ease;
    }
    .gm-panel.open { transform: translateX(0); }
    .gm-panel h2 { font-size: 20px; margin-bottom: 6px; }
    .gm-panel .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .gm-section { margin-bottom: 22px; }
    .gm-section h3 {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .gm-toggle {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #2a2a30;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background .15s;
      font-size: 14px;
    }
    .gm-toggle:hover { background: #34343c; }
    .gm-toggle.checked { background: #2c5530; }
    .gm-toggle input {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #4caf50;
    }
    .gm-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .gm-action {
      flex: 1;
      padding: 9px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    .gm-action:hover { background: #555; }
    .gm-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }
    .gm-close:hover { color: #fff; }

    /* ===== Image lightbox ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
      cursor: zoom-out;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .gm-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <img src="material/kaijodoko_logo.png" alt="ロゴ" class="logo" id="logo">
  </header>

  <main>
    <section class="panel left-panel">
      <div class="tabs" id="tabs"></div>
      <div class="mission-view" id="mission-view"></div>
    </section>

    <aside class="panel right-panel">
      <h2>モノサーチャー調査結果</h2>
      <div class="result-btns" id="result-btns"></div>
    </aside>
  </main>

  <aside class="gm-panel" id="gm-panel" aria-hidden="true">
    <button class="gm-close" id="gm-close" aria-label="閉じる">×</button>
    <h2>GMメニュー</h2>
    <div class="hint">
      ロゴを3回連続タップで開閉<br>
      （PCでは Ctrl + Shift + G でも可）
    </div>

    <div class="gm-section">
      <h3>ミッション公開</h3>
      <div id="gm-missions"></div>
    </div>

    <div class="gm-section">
      <h3>調査結果公開</h3>
      <div id="gm-results"></div>
    </div>

    <div class="gm-actions">
      <button class="gm-action" id="gm-all-on">全て公開</button>
      <button class="gm-action" id="gm-all-off">全て非公開</button>
    </div>
  </aside>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

  <script>
    const MISSIONS = [
      { id: 'mission1', label: 'ミッション①',     img: 'material/mission_1.png' },
      { id: 'mission2', label: 'ミッション②',     img: 'material/mission_2.png' },
      { id: 'last1',    label: '最終ミッション①', img: 'material/last_mission_1.png' },
      { id: 'last2',    label: '最終ミッション②', img: 'material/last_mission_2.png' },
    ];

    const RESULTS = [
      { id: 'b', label: '調査結果 B', img: 'material/chousakekka_b.png' },
      { id: 'd', label: '調査結果 D', img: 'material/chousakekka_d.png' },
      { id: 'f', label: '調査結果 F', img: 'material/chousakekka_f.png' },
    ];

    const STORAGE_KEY = 'gm-visibility-v1';
    const DEFAULT_VIS = {
      missions: { mission1: true, mission2: false, last1: false, last2: false },
      results:  { b: false, d: false, f: false }
    };

    function loadVis() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          const parsed = JSON.parse(s);
          return {
            missions: { ...DEFAULT_VIS.missions, ...(parsed.missions || {}) },
            results:  { ...DEFAULT_VIS.results,  ...(parsed.results  || {}) },
          };
        }
      } catch (e) { /* fallthrough */ }
      return JSON.parse(JSON.stringify(DEFAULT_VIS));
    }
    function saveVis() { localStorage.setItem(STORAGE_KEY, JSON.stringify(vis)); }

    let vis = loadVis();
    let activeTab = null;

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      const view = document.getElementById('mission-view');
      tabs.innerHTML = '';

      const visibleMissions = MISSIONS.filter(m => vis.missions[m.id]);
      if (activeTab && !vis.missions[activeTab]) activeTab = null;
      if (!activeTab && visibleMissions.length) activeTab = visibleMissions[0].id;

      visibleMissions.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (activeTab === m.id ? ' active' : '');
        btn.textContent = m.label;
        btn.onclick = () => { activeTab = m.id; renderTabs(); };
        tabs.appendChild(btn);
      });

      view.innerHTML = '';
      if (!visibleMissions.length) {
        view.innerHTML = '<div class="empty-state">まだミッションは公開されていません</div>';
        return;
      }
      const current = MISSIONS.find(m => m.id === activeTab);
      if (current) {
        const img = document.createElement('img');
        img.src = current.img;
        img.alt = current.label;
        view.appendChild(img);
      }
    }

    function renderResults() {
      const btnContainer = document.getElementById('result-btns');
      btnContainer.innerHTML = '';

      const visibleResults = RESULTS.filter(r => vis.results[r.id]);

      if (!visibleResults.length) {
        btnContainer.innerHTML = '<div style="color:#aaa;font-size:14px;padding:8px 0;">まだ公開されていません</div>';
        return;
      }

      visibleResults.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'result-btn';
        btn.textContent = r.label;
        btn.onclick = () => openLightbox(r.img, r.label);
        btnContainer.appendChild(btn);
      });
    }

    function renderGM() {
      const mC = document.getElementById('gm-missions');
      const rC = document.getElementById('gm-results');
      mC.innerHTML = '';
      rC.innerHTML = '';

      MISSIONS.forEach(m => mC.appendChild(makeToggle(m, vis.missions, () => {
        saveVis(); renderTabs(); renderGM();
      })));
      RESULTS.forEach(r => rC.appendChild(makeToggle(r, vis.results, () => {
        saveVis(); renderResults(); renderGM();
      })));
    }

    function makeToggle(item, store, onChange) {
      const lbl = document.createElement('label');
      lbl.className = 'gm-toggle' + (store[item.id] ? ' checked' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!store[item.id];
      cb.onchange = () => { store[item.id] = cb.checked; onChange(); };
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(item.label));
      return lbl;
    }

    function renderAll() { renderTabs(); renderResults(); renderGM(); }

    // ===== GM panel toggle =====
    const gmPanel = document.getElementById('gm-panel');
    function toggleGM() {
      gmPanel.classList.toggle('open');
      gmPanel.setAttribute('aria-hidden', gmPanel.classList.contains('open') ? 'false' : 'true');
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'G' || e.key === 'g')) {
        e.preventDefault();
        toggleGM();
      }
      if (e.key === 'Escape') {
        if (gmPanel.classList.contains('open')) toggleGM();
        closeLightbox();
      }
    });

    document.getElementById('gm-close').onclick = toggleGM;

    document.addEventListener('click', (e) => {
      if (!gmPanel.classList.contains('open')) return;
      if (gmPanel.contains(e.target)) return;
      if (e.target.id === 'logo') return;
      toggleGM();
    });

    let logoClicks = 0;
    let logoTimer = null;
    document.getElementById('logo').addEventListener('click', () => {
      logoClicks++;
      if (logoTimer) clearTimeout(logoTimer);
      logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
      if (logoClicks >= 3) { logoClicks = 0; toggleGM(); }
    });

    document.getElementById('gm-all-on').onclick = () => {
      MISSIONS.forEach(m => vis.missions[m.id] = true);
      RESULTS.forEach(r => vis.results[r.id] = true);
      saveVis(); renderAll();
    };
    document.getElementById('gm-all-off').onclick = () => {
      MISSIONS.forEach(m => vis.missions[m.id] = false);
      RESULTS.forEach(r => vis.results[r.id] = false);
      saveVis(); renderAll();
    };

    // ===== Lightbox =====
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); }
    lightbox.addEventListener('click', closeLightbox);

    renderAll();
  </script>
</body>
</html>
